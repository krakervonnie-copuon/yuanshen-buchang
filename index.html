<style>
:root{--red:#c81e2b;--gold:#d4b078;--dark:#08070a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:'Noto Sans TC',system-ui;background:#08070a;color:#fff;overflow-x:hidden}
a{color:inherit;text-decoration:none}

/* 頂部導航 - 還原官網風格 */
.topnav{position:fixed;top:0;left:0;right:0;z-index:50;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 14px;background:linear-gradient(180deg, rgba(12,10,16,0.92) 0%, rgba(12,10,16,0.72) 100%);backdrop-filter:blur(14px);border-bottom:1px solid rgba(212,176,120,0.18)}
@media(min-width:768px){.topnav{height:64px;padding:0 24px}}
.nav-left{display:flex;align-items:center;gap:14px}
.logo{font-family:'Noto Serif TC',serif;font-weight:900;font-size:20px;letter-spacing:.1em;color:#fff;text-shadow:0 0 10px rgba(255,255,255,0.3)}
.logo small{font-size:10px;opacity:.6;display:block;margin-top:-2px;letter-spacing:.2em}
.nav-icons{display:none;gap:10px}
@media(min-width:768px){.nav-icons{display:flex}}
.nav-icons i{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.14);display:grid;place-items:center;font-size:14px;cursor:pointer}
.nav-right{display:flex;align-items:center;gap:8px}
.nav-btn{height:32px;padding:0 14px;border-radius:4px;font-size:11px;font-weight:700;letter-spacing:.12em;border:1px solid rgba(212,176,120,0.35);background:linear-gradient(180deg, rgba(120,20,28,0.9), rgba(60,10,15,0.9));color:#f8d8a0;clip-path:polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);cursor:pointer}
.nav-btn.light{background:linear-gradient(180deg, #f5f0e8, #e8ddd0);color:#4a2e1a;border-color:#d4b078}
@media(max-width:480px){.nav-btn{padding:0 10px;font-size:10px;height:30px}.nav-btn:nth-child(1),.nav-btn:nth-child(2){display:none}}

/* Hero - 往冥府風格 */
.hero{position:relative;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:72px 0 0;overflow:hidden;background:#08070a}
.hero-bg{position:absolute;inset:0}
.hero-bg img{width:100%;height:100%;object-fit:cover;object-position:center 30%;filter:brightness(0.95) contrast(1.1)}
.hero-bg::after{content:'';position:absolute;inset:0;background:
  linear-gradient(180deg, rgba(8,7,10,0.15) 0%, rgba(8,7,10,0.05) 35%, rgba(8,7,10,0.55) 72%, #08070a 92%),
  radial-gradient(120% 40% at 50% 48%, rgba(200,30,43,0.22) 0%, transparent 70%);
}
.red-line{position:absolute;left:-10%;right:-10%;top:48%;height:2px;background:linear-gradient(90deg, transparent, #ff2a3a 15%, #ff5a65 50%, #ff2a3a 85%, transparent);box-shadow:0 0 12px #ff2a3a, 0 0 24px #ff1a2a, 0 0 40px rgba(255,30,50,0.6);animation:linePulse 3s ease-in-out infinite;z-index:1}
.red-line::before{content:'';position:absolute;top:-18px;left:0;right:0;height:36px;background:linear-gradient(180deg, transparent, rgba(255,42,58,0.18), transparent);filter:blur(6px)}
@keyframes linePulse{0%,100%{opacity:.9;transform:scaleY(1)}50%{opacity:1;transform:scaleY(1.4)}}
.hero-content{position:relative;z-index:2;width:100%;max-width:1120px;margin:0 auto;padding:0 16px 18px;text-align:center}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;background:rgba(0,0,0,0.45);border:1px solid rgba(212,176,120,0.25);font-size:9px;letter-spacing:.28em;color:#d4b078;backdrop-filter:blur(6px)}
.main-title{font-family:'Noto Serif TC',serif;font-weight:900;font-size:clamp(36px, 11vw, 82px);line-height:0.95;letter-spacing:.06em;margin:12px 0 0;color:#fff;text-shadow:0 2px 0 #000, 0 0 20px rgba(200,30,43,0.8), 0 0 40px rgba(200,30,43,0.5);background:linear-gradient(180deg, #fff 0%, #f3e6d0 35%, #c9a87a 60%, #8a6a42 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;-webkit-text-stroke:1px rgba(0,0,0,0.6);filter:drop-shadow(0 3px 0 #000)}
@media(max-width:380px){.main-title{font-size:32px}}
.sub-title{margin-top:6px;font-size:10px;letter-spacing:.36em;color:#ff9da6;opacity:.9;text-shadow:0 0 8px rgba(255,40,60,0.6)}
@media(min-width:768px){.sub-title{font-size:12px;letter-spacing:.48em}}

/* 獎勵卡片 - 暗紅金邊風格 */
.rewards{display:flex;gap:8px;margin-top:18px;justify-content:center}
@media(min-width:768px){.rewards{gap:14px;margin-top:22px}}
.reward-card{flex:1;max-width:118px;position:relative;padding:10px 6px 10px;border-radius:12px;background:linear-gradient(180deg, rgba(28,18,20,0.92), rgba(14,10,12,0.96));border:1px solid rgba(212,176,120,0.28);box-shadow:0 6px 18px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.12);text-align:center}
@media(min-width:768px){.reward-card{max-width:160px;padding:14px 10px 12px;border-radius:16px}}
.reward-card::before{content:'';position:absolute;top:4px;left:4px;right:4px;bottom:4px;border:1px solid rgba(212,176,120,0.12);border-radius:10px;pointer-events:none}
.reward-card img{width:52px;height:52px;object-fit:contain;margin:0 auto;display:block;filter:drop-shadow(0 0 8px rgba(255,200,150,0.6))}
@media(min-width:768px){.reward-card img{width:68px;height:68px}}
.reward-card h4{margin:6px 0 0;font-size:10px;letter-spacing:.14em;color:#e8c9a0;font-weight:700}
.reward-card .amt{font-size:16px;font-weight:900;color:#fff;text-shadow:0 0 8px rgba(255,100,100,0.6);margin-top:2px}
@media(min-width:768px){.reward-card .amt{font-size:20px}}

/* 底部按鈕 - 官網 PC下載風格 */
.cta-wrap{margin-top:18px;display:flex;flex-direction:column;align-items:center;gap:10px;padding-bottom:22px}
.pc-btn{position:relative;width:min(86vw, 320px);height:52px;background:linear-gradient(180deg, #5a1220 0%, #3a0a14 50%, #5a1220 100%);border:1px solid #8a2a3a;border-radius:4px;display:flex;align-items:center;justify-content:center;cursor:pointer;clip-path:polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);box-shadow:0 0 0 1px rgba(0,0,0,0.8), 0 0 16px rgba(200,30,43,0.5), 0 8px 20px rgba(0,0,0,0.6);transition:all .2s}
.pc-btn:hover{transform:translateY(-1px);box-shadow:0 0 0 1px #000, 0 0 24px rgba(255,40,60,0.7), 0 10px 28px rgba(0,0,0,0.7);filter:brightness(1.15)}
.pc-btn .txt{font-family:'Noto Serif TC',serif;font-size:15px;font-weight:900;letter-spacing:.22em;color:#ffd9a0;text-shadow:0 1px 0 #000, 0 0 10px rgba(255,200,100,0.5)}
.pc-btn .sub{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);font-size:8px;color:#ff9aa3;letter-spacing:.1em;opacity:.8}
@media(min-width:768px){.pc-btn{width:360px;height:56px}.pc-btn .txt{font-size:16px}}

/* 左下禮盒 - 官網同款 */
.gift{position:fixed;left:10px;bottom:18px;z-index:40;width:56px;height:56px;border-radius:50%;background:radial-gradient(100% 100% at 30% 20%, #ff3a4a, #9a1020);border:2px solid #ffd9a0;box-shadow:0 0 0 3px rgba(0,0,0,0.5), 0 0 18px rgba(255,30,50,0.7), 0 6px 18px rgba(0,0,0,0.6);display:grid;place-items:center;cursor:pointer;animation:giftFloat 2.5s ease-in-out infinite}
@keyframes giftFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.gift span{font-size:22px;filter:drop-shadow(0 1px 0 #000)}
.gift small{position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:8px;color:#ffd9a0;background:rgba(0,0,0,0.7);padding:2px 6px;border-radius:999px;border:1px solid rgba(212,176,120,0.3)}

/* Modal - 暗色版 */
.modal-mask{position:fixed;inset:0;z-index:100;background:rgba(5,3,8,0.82);backdrop-filter:blur(12px);display:none;place-items:center;padding:16px}
.modal-mask.show{display:grid}
.modal-box{width:min(92vw, 380px);background:linear-gradient(180deg, #1c1418, #0f0c10);border:1px solid rgba(212,176,120,0.32);border-radius:14px;box-shadow:0 0 0 1px #000, 0 0 32px rgba(200,30,43,0.3), 0 20px 50px rgba(0,0,0,0.7);padding:22px 18px 18px;position:relative;text-align:center}
.modal-box h3{font-family:'Noto Serif TC';font-size:18px;font-weight:900;color:#f5d9a0;margin:0 0 10px;letter-spacing:.12em}
.modal-box p{font-size:12px;line-height:1.7;color:#c9a8a0;margin:0 auto 16px}
.modal-box .m-btn{width:100%;height:48px;border:0;border-radius:6px;background:linear-gradient(180deg, #c81e2b, #7a1020);color:#ffd9a0;font-size:14px;font-weight:900;letter-spacing:.18em;cursor:pointer;clip-path:polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%)}
</style>
</head>

<header class="topnav">

    <button class="nav-btn" onclick="window.open('https://sdk.hoyoverse.com/payment/genshin/zh-hant/index.html?utm_content=fabtopup&utm_id=2&utm_medium=event&utm_source=fab', '_blank')">儲值福利</button>

<section class="hero">

  <div class="hero-content">
    <div class="badge">❖ 7.1版本「往冥府的安魂歌」 ❖</div>

      <div class="reward-card"><img src="acquaint_clean.png" alt="相遇之緣"><h4>相遇之緣</h4><div class="amt">×10</div></div>

      <button class="pc-btn" id="openModal">
        <span class="txt">立即領取兌換碼</span>

  </div>
</section>

<div class="gift" id="giftBtn"><span>🎁</span><small>新手/回歸福利</small></div>

<div class="modal-mask" id="modalMask">
  <div class="modal-box">
    <button id="closeModal" style="position:absolute;top:8px;right:10px;width:28px;height:28px;border-radius:50%;border:1px solid rgba(212,176,120,0.25);background:rgba(0,0,0,0.4);color:#d4b078;cursor:pointer">✕</button>
    <h3>申請領取說明</h3>
    <p>參與「往冥府的安魂歌」前瞻活動，即可領取原石等限時獎勵！<br><span style="font-size:10px;opacity:.7;text-align:left;display:block;margin-top:10px;line-height:1.6">*兌換碼將於2026/9/22 23:59:59（UTC+8）失效<br>*每個帳號限領一次，請盡快兌換</span></p>
    <button class="m-btn" onclick="window.open('https://lin.ee/VHM10Ls', '_blank')">前往領取禮包兌換碼</button>
  </div>
</div>

<script>
const mask=document.getElementById('modalMask');
document.getElementById('openModal').addEventListener('click',()=>mask.classList.add('show'));
document.getElementById('giftBtn').addEventListener('click',()=>mask.classList.add('show'));
document.getElementById('closeModal').addEventListener('click',()=>mask.classList.remove('show'));
mask.addEventListener('click',e=>{if(e.target===mask)mask.classList.remove('show')});
</script>
